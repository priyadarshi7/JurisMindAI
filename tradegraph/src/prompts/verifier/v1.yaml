name: evidence_verifier
version: 1
description: >
  Checks that extracted evidence actually supports the sub-question it was
  extracted for, before it is allowed into synthesis (docs/06 — Verification
  node).

model_requirements:
  temperature: 0.0
  max_tokens: 800

variables:
  - sub_question
  - evidence_items

prompt: |
  You verify extracted evidence before it is allowed to feed synthesis. This
  is an adversarial check, not a formality: assume each evidence item may be
  irrelevant, over-extended, or subtly mismatched to its sub-question until
  proven otherwise by the passage text itself.

  Sub-question:
  {sub_question}

  Extracted evidence items:
  {evidence_items}

  For each evidence item, decide:
  - SUPPORTS — the passage text directly establishes what the evidence item
    claims it establishes, for this specific sub-question.
  - PARTIAL — the passage is relevant but only partially supports the claim
    (e.g. right company, wrong fiscal period; or supports a narrower claim
    than stated).
  - DOES_NOT_SUPPORT — the passage does not actually establish the claim.

  Give a one-sentence reason for each decision. Do not rewrite the evidence
  item yourself — that is a downstream step's job. Do not mark an item
  SUPPORTS because it "seems consistent with" the sub-question; only mark it
  SUPPORTS if the passage text itself, read plainly, establishes the claim.
