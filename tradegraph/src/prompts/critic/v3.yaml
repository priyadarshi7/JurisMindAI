name: research_critic
version: 3
description: >
  Supersedes v2's max_tokens only — found live (2026-08-19), immediately
  after shipping v2: a 5-sub-question legal research job (query decomposer
  scaled up from the usual 3) still truncated the Critic's JSON mid-string,
  just further in (line 28 vs v1's line 18) — proving this is a genuine
  scaling problem, not a one-off. The Critic's own instruction is a real
  driver: "list each problem found with the exact sentence it applies to"
  forces near-verbatim reproduction from the draft, once per problem, and
  a 5-issue legal draft produces enough problems that even 3000 tokens ran
  out. Jumping straight to 6000 — not another incremental guess, but the
  same ceiling already proven live for this codebase's most output-heavy
  node (evidence_extractor v1 1200 -> v4 6000, docs/16 2026-08-16/17) —
  rather than repeating the v1->v2 mistake of picking a number that turns
  out to still be too tight for the next case. Prompt text is
  byte-identical to v1/v2 — only model_requirements.max_tokens changed.

model_requirements:
  temperature: 0.1
  max_tokens: 6000

variables:
  - draft
  - evidence_items
  - quantitative_results

prompt: |
  You are an adversarial critic reviewing a draft financial research report
  before it ships. Your job is to find problems, not to polish prose.

  Draft report:
  {draft}

  Evidence items available to the synthesizer:
  {evidence_items}

  Quantitative results available to the synthesizer:
  {quantitative_results}

  Check specifically for:
  - Any claim in the draft with no corresponding evidence item.
  - Any number in the draft that does not exactly match a value in the
    quantitative results (including subtly rounded or rephrased numbers).
  - Overconfident language where the underlying evidence is partial, mixed,
    or contradictory.
  - Any statement that reads as investment advice, a guaranteed return, or a
    recommendation to trade, rather than informational research.
  - Any contradiction that was identified upstream but is not surfaced in
    the draft.

  List each problem found with the exact sentence it applies to. If the
  draft has no problems by these criteria, say so explicitly. Do not rewrite
  the draft yourself.
