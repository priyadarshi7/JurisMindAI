[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# sqlalchemy.url is deliberately absent — migrations/env.py reads
# DATABASE_URL from src.core.config.get_settings() instead, so the same
# secret-management rule applies here as everywhere else (docs/11, docs/12
# §12): no connection string committed to the repo.

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
