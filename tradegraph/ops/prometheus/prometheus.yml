# Metric families and label discipline are fixed by docs/15 D-31 — see the
# doc for the full list.
#
# ❗ research_id must never appear as a label anywhere in this stack — it
# belongs in traces and PostgreSQL (docs/10, D-31).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The API and the research worker run on the HOST (uvicorn / celery run
  # directly, per README.md's setup steps) — there is no "api"/"worker"
  # Compose service to reach by container DNS name. Prometheus itself runs
  # inside a container, so it must reach back out to the host via Docker
  # Desktop's host.docker.internal, not localhost (that would be this
  # Prometheus container itself) and not a Compose service name (there
  # isn't one — see docker-compose.yml, no "api"/"worker" service exists).
  - job_name: jurismindai-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: jurismindai-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]   # settings.prometheus_metrics_port

  # The reranker DOES run as a real Compose service on this network, so its
  # container DNS name resolves correctly here, unlike the two above.
  - job_name: reranker
    metrics_path: /metrics
    static_configs:
      - targets: ["reranker:8081"]

  # Ollama has no native Prometheus endpoint — model_latency/concurrency
  # (D-31) come from worker- and reranker-side instrumentation around each
  # Ollama call (src/graph/llm_client.py, src/rag/embeddings/ollama_embedder.py),
  # not a direct scrape target.
