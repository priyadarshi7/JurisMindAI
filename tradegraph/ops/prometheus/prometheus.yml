# Metric families and label discipline are fixed by docs/15 D-31 — see the
# doc for the full list. Scrape targets below are commented out until each
# service actually exports a /metrics endpoint (V1+); the shape is here so
# adding one is a one-line uncomment, not a redesign.
#
# ❗ research_id must never appear as a label anywhere in this stack — it
# belongs in traces and PostgreSQL (docs/10, D-31).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # - job_name: tradegraph-api
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["api:8000"]

  # - job_name: tradegraph-worker
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["worker:9464"]   # settings.prometheus_metrics_port

  # - job_name: reranker
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["reranker:8081"]

  # Ollama has no native Prometheus endpoint — model_latency/concurrency/
  # queue metrics (D-31) come from worker-side instrumentation around each
  # Ollama call, not a direct scrape target.
