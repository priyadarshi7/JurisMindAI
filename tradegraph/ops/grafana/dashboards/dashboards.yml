# Grafana dashboard provisioning config. Mounted into
# /etc/grafana/provisioning/dashboards by docker-compose.yml.
apiVersion: 1

providers:
  - name: jurismindai
    orgId: 1
    folder: JurisMindAI
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
